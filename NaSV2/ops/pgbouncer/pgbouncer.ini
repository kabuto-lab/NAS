; AX•CMS PgBouncer · master config · ENTITY §3.4.1, §3.4.2
;
; HARD GATE: pool_mode MUST be `transaction`.  `nas2-pool-validator`
; refuses to boot the server otherwise (ENTITY §3.4.1).
;
; Logical pools live in databases.ini and are included below so the
; split-pool topology stays in a single file when reviewed.

%include /etc/pgbouncer/databases.ini

[pgbouncer]
; ── network ────────────────────────────────────────────────────────
listen_addr        = 0.0.0.0
listen_port        = 5432
unix_socket_dir    =

; ── auth ───────────────────────────────────────────────────────────
; Dev uses `trust` for ergonomics.  Production overrides via secrets
; manager to `scram-sha-256` + auth_query (ENTITY §13 hygiene).
auth_type          = trust
auth_file          = /etc/pgbouncer/userlist.txt

; ── pool semantics · §3.4.1 HARD GATE ──────────────────────────────
pool_mode          = transaction
max_client_conn    = 1000
default_pool_size  = 25
reserve_pool_size  = 5
reserve_pool_timeout = 3
server_reset_query = DISCARD ALL
server_check_delay = 30
server_lifetime    = 3600
server_idle_timeout = 600

; ── observability ──────────────────────────────────────────────────
admin_users        = postgres
stats_users        = postgres
log_connections    = 1
log_disconnections = 0
log_pooler_errors  = 1
verbose            = 0

; ── safety ─────────────────────────────────────────────────────────
ignore_startup_parameters = extra_float_digits,search_path
