; AX•CMS PgBouncer · logical pool aliases · ENTITY §3.4.2
;
; All three aliases route to the same physical Postgres database
; (`ax_cms_dev`) but receive isolated connection budgets so HTTP
; traffic, queue workers, and admin/migrate jobs cannot starve each
; other.  Quantitative defaults (pool_size) match the §3.4.2
; reference table.
;
; Format: <alias> = host=<pg-host> port=<pg-port> dbname=<physical>
;                   pool_size=<N> reserve_pool=<N> pool_mode=transaction

[databases]

; HTTP request-handling — the largest of the three; sized to absorb
; the production read-RPS budget (ENTITY §3.4.2 reference value 25).
http_pool   = host=postgres port=5432 dbname=ax_cms_dev pool_size=25 reserve_pool=5 pool_mode=transaction

; Background workers (pgmq consumers, NATS subscribers, image jobs).
; Smaller pool because workers are batch-friendly and tolerate queueing.
worker_pool = host=postgres port=5432 dbname=ax_cms_dev pool_size=10 reserve_pool=2 pool_mode=transaction

; Admin / migrations / CLI tools.  Intentionally tiny so an oversized
; migration script cannot exhaust client capacity for the API.
admin_pool  = host=postgres port=5432 dbname=ax_cms_dev pool_size=5  reserve_pool=2 pool_mode=transaction
