name: NaSV2 nightly bench

# AX•CMS (NaSV2) nightly benchmark — compares against baseline,
# opens an issue on regression > 5%.
# Implementation in NaSV2/xtask/src/commands/bench_runner.rs (P4 X2).

on:
  schedule:
    - cron: '0 3 * * *'  # 03:00 UTC daily
  workflow_dispatch:

defaults:
  run:
    working-directory: NaSV2

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

permissions:
  contents: read
  issues: write

jobs:
  bench:
    name: cargo xtask bench-runner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: NaSV2
      - name: Run benchmarks
        id: bench
        # `bench-runner` exits 1 on > 5% regression; capture so we can
        # branch the issue-creation step on the failure.
        continue-on-error: true
        run: cargo xtask bench-runner

      - name: Open regression issue
        if: steps.bench.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const title = `Nightly bench regression — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              `\`cargo xtask bench-runner\` reported a regression above the 5% threshold.`,
              ``,
              `- Workflow: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `- Commit: ${context.sha}`,
              ``,
              `Inspect the failing job's stdout for the per-bench delta. Compare against`,
              `\`NaSV2/docs/perf/baseline.json\` and decide whether to (a) absorb the`,
              `regression by updating the baseline, or (b) bisect for the offending change.`,
            ].join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['perf-regression', 'ax-cms'],
            });
